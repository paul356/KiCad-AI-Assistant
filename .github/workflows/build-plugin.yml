name: Build KiCad Plugin ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    name: Build kicad_ai_assistant plugin zip

    steps:
    - uses: actions/checkout@v4

    - name: Build plugin archives (make dist-plugin dist-pcm)
      run: make dist-plugin dist-pcm

    - name: Upload plugin archives
      uses: actions/upload-artifact@v4
      with:
        name: kicad-ai-assistant-plugin
        path: |
          dist/kicad_ai_assistant.zip
          dist/kicad_ai_assistant_pcm.zip
