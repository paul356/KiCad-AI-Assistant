name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write  # Required for trusted publishing (OIDC)
  contents: read

jobs:
  # Skip the build/publish when pyproject.toml version already exists on PyPI
  check-version:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
    - uses: actions/checkout@v4

    - name: Check version against PyPI
      id: check
      env:
        PYPI_PACKAGE: kcaa
      run: |
        VERSION=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/^version = "([^"]+)"/\1/')
        if [ -z "$VERSION" ]; then
          echo "::error::Could not read version from pyproject.toml"
          exit 1
        fi
        PYPI_VERSION=$(curl -fsSL "https://pypi.org/pypi/${PYPI_PACKAGE}/json" | python3 -c 'import json, sys; print(json.load(sys.stdin)["info"]["version"])' 2>/dev/null || echo "")
        echo "Local version:  ${VERSION}"
        echo "Published version: ${PYPI_VERSION:-<none>}"
        if [ -n "$PYPI_VERSION" ] && [ "$VERSION" = "$PYPI_VERSION" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "Version unchanged on PyPI, skipping publish."
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

  build:
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.skip != 'true'
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python
      run: |
        uv python install 3.12
        uv python pin 3.12

    - name: Build package
      run: uv build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: needs.check-version.outputs.skip != 'true'
    environment: pypi
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  # Attach both plugin archives and their checksums to the GitHub release:
  # kicad_ai_assistant.zip is the manual-install / in-panel updater payload,
  # kicad_ai_assistant_pcm.zip is for Plugin and Content Manager installs.
  plugin-assets:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Build plugin archives
      run: make dist-plugin dist-pcm

    - name: Verify plugin VERSION matches release tag
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        expected="${TAG#v}"
        if [[ ! "$expected" =~ ^[0-9]+(\.[0-9]+)*([.-][A-Za-z0-9]+)*$ ]]; then
          echo "::error::Release tag '$expected' is not an installable version"
          exit 1
        fi
        echo "Release tag: ${expected}"
        for spec in \
          "kicad_ai_assistant.zip:kicad_ai_assistant/VERSION" \
          "kicad_ai_assistant_pcm.zip:plugins/VERSION" \
        do
          archive="${spec%%:*}"
          member="${spec#*:}"
          actual="$(unzip -p "dist/${archive}" "${member}" | tr -d '[:space:]')"
          echo "${archive} VERSION: ${actual}"
          if [ -z "${actual}" ] || [ "${actual}" != "${expected}" ]; then
            echo "::error::${archive} VERSION '${actual}' does not match release tag '${expected}'"
            exit 1
          fi
        done

    - name: Generate checksums
      run: cd dist && sha256sum kicad_ai_assistant.zip kicad_ai_assistant_pcm.zip > SHA256SUMS

    - name: Upload release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.release.tag_name }}
      run: gh release upload "$TAG" dist/kicad_ai_assistant.zip dist/kicad_ai_assistant_pcm.zip dist/SHA256SUMS --clobber
