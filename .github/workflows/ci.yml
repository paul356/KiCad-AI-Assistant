name: CI

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Detect Changed Paths
    outputs:
      code: ${{ steps.filter.outputs.code }}
      pyproject: ${{ steps.filter.outputs.pyproject }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          code:
            - 'kcaa/**'
            - 'kicad_plugin/**'
            - 'tests/**'
            - 'uv.lock'
          pyproject:
            - 'pyproject.toml'

  lint:
    runs-on: ubuntu-latest
    name: Lint and Format

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python 3.12
      run: |
        uv python install 3.12
        uv python pin 3.12

    - name: Install dependencies
      run: uv sync --group dev

    - name: Lint with ruff
      run: uv run ruff check kcaa/ tests/ kicad_plugin/

    - name: Check formatting with ruff
      run: uv run ruff format --check kcaa/ tests/ kicad_plugin/

  test:
    runs-on: ubuntu-latest
    name: Test Python 3.13
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      KICAD_VERSION: "10"

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python 3.13
      run: |
        uv python install 3.13
        uv python pin 3.13

    - name: Install dependencies
      run: uv sync --group dev

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install jsdom
      run: npm install jsdom

    - name: Run tests
      run: uv run python -m pytest tests/ -v --cov=kcaa --cov-report=xml --cov-fail-under=55

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    name: Security Scan
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python 3.12
      run: |
        uv python install 3.12
        uv python pin 3.12

    - name: Install dependencies
      run: uv sync --group dev

    - name: Run security scan
      run: uv run bandit -r kcaa/ kicad_plugin/

  test-windows:
    runs-on: windows-latest
    name: Test Windows (integration)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      KICAD_MCP_PROFILE: "plugin"
      KICAD_VERSION: "10"

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python 3.12
      run: |
        uv python install 3.12
        uv python pin 3.12

    - name: Install dependencies
      run: uv sync --group dev

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install jsdom
      run: npm install jsdom

    - name: Run integration tests
      run: uv run python -m pytest tests/integration/ -v --tb=short -o "addopts="

  build:
    runs-on: ubuntu-latest
    name: Build Package
    needs: [lint, test, changes]
    # Run when code OR pyproject.toml (e.g. version bump) changed; do not run
    # when a prerequisite failed, but do run when test was skipped
    # (pyproject-only PRs still validate packaging metadata).
    if: (needs.changes.outputs.code == 'true' || needs.changes.outputs.pyproject == 'true') && needs.lint.result != 'failure' && needs.test.result != 'failure'

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true

    - name: Set up Python 3.12
      run: |
        uv python install 3.12
        uv python pin 3.12

    - name: Build package
      run: uv build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
